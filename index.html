<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<title>ميزانية المذكرات – كفالة الدعاة</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="application-name" content="Kafalah">
<meta name="apple-mobile-web-app-title" content="Kafalah">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f8f5;--card:#fff;--tx:#1b1f1b;--mut:#5f6b5f;--bd:#d9e0d6;--pri:#2e7d32;--priTx:#fff;--hd:#92d050;--neg:#c62828;--negBg:#fde8e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121512;--card:#1c211c;--tx:#eef2ed;--mut:#9aa89a;--bd:#344034;--pri:#66bb6a;--priTx:#102010;--hd:#3d6b22;--neg:#ff8a80;--negBg:#3a1d1d;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;padding-bottom:84px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--pri);color:var(--priTx);padding:10px 14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pri);z-index:10}
header h1{margin:0 0 6px;font-size:16px}
select,input,textarea,button{font:inherit}
header select{width:100%;padding:8px;border-radius:8px;border:0;background:var(--card);color:var(--tx)}
main{padding:12px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mut{color:var(--mut);font-size:13px}.neg{color:var(--neg)}.b{font-weight:bold}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pri)}
.bar i.over{background:var(--neg)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 2px;font-size:12px}
nav button.on{color:var(--pri);font-weight:bold;border-top:3px solid var(--pri)}
.btn{background:var(--pri);color:var(--priTx);border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
.btn.alt{background:transparent;color:var(--pri);border:1px solid var(--pri)}.btn.red{background:var(--neg);color:#fff}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1}
[dir="ltr"] .fab{left:auto!important;right:16px}
.fab{position:fixed;left:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:7;border-radius:50%;width:54px;height:54px;font-size:28px;padding:0;box-shadow:0 3px 8px #0004}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(94vw,420px);padding:16px}
dialog::backdrop{background:#0008}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select.f,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px}
th,td{border:1px solid var(--bd);padding:6px;text-align:center}th{background:var(--hd);color:var(--tx)}
tr.tot td{background:var(--hd);font-weight:bold}tr.neg td{background:var(--negBg);color:var(--neg);font-weight:bold}
h3{margin:14px 0 6px;font-size:14px}
textarea.bk{height:90px;font-size:11px}
.rtl{unicode-bidi:plaintext}
.rh{background:var(--pri);color:var(--priTx);border-radius:10px;padding:14px;text-align:center}.rh1{font-size:22px;font-weight:bold}.rh2{font-size:13px;opacity:.9;margin-top:2px}
.rinfo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.rinfo div{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
.rinfo span,.kpi span{display:block;font-size:11px;color:var(--mut)}
.rname{text-align:center;font-weight:bold;font-size:15px;margin:6px 0 12px;line-height:1.7}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{border:1px solid var(--bd);border-radius:10px;padding:8px 4px;text-align:center}.kpi b{font-size:13px}
.kpi.good{border-color:var(--pri)}.kpi.good b{color:var(--pri)}.kpi.bad{background:var(--negBg);border-color:var(--neg)}.kpi.bad b{color:var(--neg)}
.sec{background:var(--hd);padding:7px 12px;border-radius:8px;margin:18px 0 8px;font-size:14px}
.rpt table td.amt{white-space:nowrap;font-weight:bold}.t5 tr:nth-child(even) td{background:var(--bg)}.t5 tr.tot td{background:var(--hd)}.t5 td:nth-child(3){text-align:start}
.tag{font-size:11px;color:var(--mut);font-weight:normal}
.rf{text-align:center;color:var(--mut);font-size:11px;margin-top:18px;border-top:1px dashed var(--bd);padding-top:8px}
.rtitle{text-align:center;font-weight:bold;font-size:17px;line-height:1.9;color:var(--pri);padding:12px 8px;margin-bottom:4px;border-top:3px double var(--pri);border-bottom:3px double var(--pri)}
.sec{border-inline-start:6px solid var(--pri);border-radius:6px;font-size:14px;font-weight:bold}
.rpt{--ln:#000}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rpt{--ln:#d5ddd5}}
.rpt table{border-collapse:separate;border-spacing:0;border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.rpt th{background:var(--pri);color:var(--priTx);border:0;padding:9px 6px;font-size:12.5px}
.rpt th:not(:last-child){border-inline-end:1px solid var(--ln)}
.rpt td{border:0;border-bottom:1px solid var(--ln);padding:8px 6px}
.rpt td:not(:last-child){border-inline-end:1px solid var(--ln)}
.rpt tr:last-child td{border-bottom:0}
.rpt td:first-child{color:var(--mut);width:34px}
.rpt tr.tot td{background:var(--hd);border-top:2px solid var(--ln);font-weight:bold}
.rpt tr.neg td{background:var(--negBg);color:var(--neg);font-weight:bold;border-top:2px solid var(--neg)}
.rpt tr.tot td:first-child{color:var(--tx)}.rpt tr.neg td:first-child{color:var(--neg)}
.rpt{background:#fff;color:#000;padding:10px;border-radius:8px;--ln:#000}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rpt{--ln:#000}}
.rpt .rtitle{text-align:center;font-weight:bold;color:#000;font-size:16px;line-height:1.9;border:0;padding:4px 8px 8px;margin:0 0 6px}
.rpt .sec{background:none;border:0;border-radius:0;padding:0;margin:14px 0 4px;font-size:14px;font-weight:bold;color:#000}
.rpt table{border-radius:0;overflow:visible;border:1px solid #000}
.rpt th{background:#92d050;color:#000;font-weight:bold;padding:6px 5px;font-size:13px}
.rpt td{color:#000;padding:6px 5px}
.rpt td:first-child{color:#000}
.rpt .t5 tr:nth-child(even) td{background:transparent}
.rpt .tag{color:#444}.rpt .mut{color:#444}
.rpt table tr.tot td,.rpt .t5 tr.tot td{background:#92d050;color:#000;border-top:1px solid #000;font-weight:bold}
.rpt tr.tot td:first-child{color:#000}
.rpt tr.neg td,.rpt tr.neg td:first-child{background:#92d050;color:#9b0000;border-top:1px solid #000;font-weight:bold}
.sh{display:flex;justify-content:space-between;background:#f8cbad;color:#000;font-weight:bold;border-radius:8px;padding:9px 12px;margin:14px 0 6px;cursor:pointer}
.rpt .t5 tr.shd td{background:#f8cbad;color:#000;font-weight:bold;text-align:start}
.rpt .t5 tr.sub td{background:#92d050;color:#000;font-weight:bold}
.rpt tr.cr td:nth-child(3),.rpt tr.cr td:nth-child(4){background:var(--rc,transparent)}
.rpt .lg{font-size:11px;margin-top:6px;color:#000}.rpt .lg i{display:inline-block;width:12px;height:12px;border:1px solid #000;vertical-align:middle;margin:0 8px 0 4px}
.rpt table{border-collapse:collapse!important;border:0!important}
.rpt th,.rpt td{border:1px solid #000!important}
@media (min-width:900px){
 body{padding-bottom:0;padding-inline-start:96px}
 header{padding:12px 28px}
 main{max-width:1100px;padding:22px 28px}
 nav{top:0;bottom:0;left:auto;right:auto;inset-inline-start:0;width:96px;flex-direction:column;justify-content:flex-start;border-top:0;border-inline-end:1px solid var(--bd);padding-top:72px;gap:4px}
 nav button{flex:none;padding:14px 4px;font-size:13px}
 nav button.on{border-top:0;border-inline-start:4px solid var(--pri);background:var(--bg)}
 #m.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start}
 #m.g>.seg,#m.g>.sh,#m.g>#addm,#m.g>.card.row,#m.g>p{grid-column:1/-1}
 #m.g>.card{margin-bottom:0}
 #m.n{max-width:900px;margin:0 auto}
 .rpt table{font-size:14px}
 .fab{bottom:28px}
}
@media (max-width:420px){main{padding:8px}.rpt{padding:6px}.rpt table{font-size:11.5px}.rpt th,.rpt td{padding:5px 3px}}
.warn{background:#fff3cd;border-color:#e6a100;color:#000;font-size:13px}.warn.red{background:#fde8e8;border-color:#c62828}
@media (min-width:900px){#lst{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start}#lst>.card.row,#lst>.warn,#lst>.sh,#lst>p{grid-column:1/-1}#lst>.card{margin-bottom:0}}
.ops{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}.ops .btn{padding:4px 12px}
.tg{color:#c77c00;font-size:12px;margin-top:4px}
.btn.alt{background:transparent}
@page{size:A4 portrait;margin:0}
@media print{main{max-width:none!important;padding:0!important}body{padding:14mm 12mm!important}.rpt{padding:0!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}tr{page-break-inside:avoid}.sec{page-break-after:avoid}header,nav,.fab,.noprint{display:none!important}body{background:#fff;padding:0}.card{border:0}body::before{display:none}}

#pp{display:none}
.pgm{position:absolute;left:-10000px;top:0;visibility:hidden}
.pcont{width:var(--cw);height:var(--ch);overflow:hidden;background:transparent;padding:0!important}
.pcont table,.sc table{font-size:13px!important}
.pcont th,.pcont td,.sc th,.sc td{padding:6px 5px!important}
.chip{display:inline-flex;gap:2px}.chip .btn{padding:5px 9px;font-size:13px}
@media print{
 body.pp-on>*:not(#pp){display:none!important}
 body.pp-on{padding:0!important;margin:0;background:#fff!important}

function paginate(rpt,H,W){
 const host=document.createElement("div");host.className="pgm";host.style.setProperty("--ch",H+"mm");host.style.setProperty("--cw",W+"mm");document.body.appendChild(host);
 let page,pages=[];const np=()=>{page=document.createElement("div");page.className="pcont rpt";host.appendChild(page);pages.push(page)};
 const over=()=>page.scrollHeight>page.clientHeight+1;np();
 [...rpt.children].forEach(el=>{
  const t=el.tagName==="TABLE"?el:(el.querySelector&&el.querySelector("table"));
  if(!t){const c=el.cloneNode(true);page.appendChild(c);if(over()&&page.children.length>1){c.remove();np();page.appendChild(c)}return}
  const rows=[...t.rows],head=rows[0]&&rows[0].querySelector("th")?rows[0]:null,body=head?rows.slice(1):rows;let cur;
  const st=()=>{cur=document.createElement("table");cur.className=t.className;if(head)cur.appendChild(head.cloneNode(true));page.appendChild(cur)};st();
  body.forEach(r=>{const c=r.cloneNode(true);cur.appendChild(c);
   if(over()){c.remove();const empty=cur.rows.length<=(head?1:0),pv=empty?cur.previousElementSibling:null;if(empty)cur.remove();
    const old=page;np();if(pv&&pv.classList.contains("sec"))page.appendChild(pv);
    if(!old.children.length){old.remove();pages.splice(pages.indexOf(old),1)}
    st();cur.appendChild(c)}})});
 const out=pages.map(q=>q.innerHTML);host.remove();return out}

 pp.innerHTML=pg.map((h,i)=>`<section class="sheet${KOP?" kop":""}"><div class="sc rpt">${h}</div>${n>1?`<div class="pn">${i+1}</div>`:""}</section>`).join("");
 document.body.appendChild(pp);document.body.classList.add("pp-on")}

window.addEventListener("afterprint",()=>{const p=document.getElementById("pp");if(p)p.remove();document.body.classList.remove("pp-on")});
