<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cek Pemasangan</title>
<style>body{font-family:Arial,sans-serif;max-width:560px;margin:20px auto;padding:0 14px;line-height:1.6}li{margin:6px 0}.ok{color:#1b7a2b}.no{color:#c62828}code{background:#eee;padding:1px 5px;border-radius:4px}</style></head><body>
<h2>Cek pemasangan aplikasi</h2><p>Halaman ini memeriksa apakah semua file yang dibutuhkan sudah terunggah.</p><ul id="l"></ul><p id="r"></p>
<script>
const files=["index.html","manifest.json","sw.js","icon-192.png","icon-512.png","icon-maskable.png","apple-touch-icon.png"],l=document.getElementById("l");let bad=0;
Promise.all(files.map(f=>fetch(f,{cache:"no-store"}).then(r=>{const ok=r.ok;if(!ok)bad++;l.insertAdjacentHTML("beforeend","<li class='"+(ok?"ok":"no")+"'>"+(ok?"✔":"✘")+" <code>"+f+"</code> "+(ok?"":"(tidak ditemukan, unggah file ini)")+"</li>")}).catch(()=>{bad++;l.insertAdjacentHTML("beforeend","<li class='no'>✘ <code>"+f+"</code></li>")}))).then(async()=>{
 let sw="belum aktif";try{const g=await navigator.serviceWorker.getRegistration("./");if(g)sw="terdaftar"}catch(e){sw="tidak didukung"}
 document.getElementById("r").innerHTML=(bad?"<b class='no'>Ada "+bad+" file yang belum terunggah.</b> ":"<b class='ok'>Semua file lengkap.</b> ")+"Service worker: <b>"+sw+"</b>. "+(bad?"":"Buka <code>index.html</code> (alamat utama), tunggu beberapa detik, lalu coba pasang lewat menu Chrome.")});
</script></body></html>
